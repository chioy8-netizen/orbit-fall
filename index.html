<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#142f28">
<title>ORBIT FALL · 轨道方块</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark;--ivory:#ebdec1;--ink:#f9ebc9;--muted:#c6c9b4;--amber:#ffba58}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:8px;background:radial-gradient(ellipse at 50% 12%,#213c35,#090f13 78%);font-family:system-ui,sans-serif;overscroll-behavior:none}
main{width:min(100%,428px);padding:12px 10px max(12px,env(safe-area-inset-bottom));border:2px solid #ecd3a4;border-radius:24px;color:#153129;background:var(--shell-image,none) center/100% 100% no-repeat,linear-gradient(145deg,#f5e6c7,#d4bb8c);box-shadow:inset 0 0 0 2px #b75b2e,0 20px 70px #0009}
header{display:flex;align-items:center;justify-content:center;margin:2px 3px 10px;text-align:center}
h1{margin:0;font-size:clamp(23px,7vw,34px);font-weight:950;letter-spacing:.085em;line-height:1}
.sub{font-size:11px;font-weight:750;letter-spacing:.22em;margin-top:3px}
.deck,.controls{--deck-width:clamp(238px,calc((100svh - 169px)/2 + 110px),400px);width:min(100%,var(--deck-width));margin-inline:auto}
.deck{display:grid;grid-template-columns:minmax(0,1fr) minmax(78px,26%);gap:7px;padding:7px;background:#172f29;border:1px solid #55705c;border-radius:14px;box-shadow:inset 0 2px 5px #0009,0 1px #fff1c7}
.screen{position:relative;align-self:start;aspect-ratio:1/2;overflow:hidden;border-radius:12px;border:3px solid #102a26;background:#0c2725;touch-action:none;border-image:var(--bezel-image) 18% stretch;box-shadow:0 0 0 1px #058d77,0 0 8px #35f8d243}
.screen canvas{display:block;width:100%;height:100%}
.screen:before,.screen:after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;z-index:1}
.screen:before{background:var(--glass-image,none) center/100% 100% no-repeat;opacity:.42}
.screen:after{background:repeating-linear-gradient(transparent 0 3px,#04171722 3px 4px);box-shadow:inset 0 0 4px 1px #5affda65,inset 0 0 15px #041c19}
aside{display:flex;flex-direction:column;gap:5px;min-width:0}
button{font:inherit;color:var(--ink);background:linear-gradient(#36564a,#244034);border:1px solid #668674;border-radius:9px;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:inset 0 1px #e3edba36,0 2px 0 #0d211b;font-weight:750}
button:focus-visible{outline:2px solid #71e8d3;outline-offset:2px}
button:active{transform:translateY(2px);filter:brightness(1.16);box-shadow:none}
button:disabled{opacity:.66;cursor:default}
#pause{min-height:44px}
.module,.stats{padding:4px;background:#0d2620;border:1px solid #476354;border-radius:8px;color:var(--muted)}
.module{text-align:center}.label{font-size:11px;font-weight:700;white-space:nowrap}
.module canvas{display:block;width:100%;height:33px;object-fit:contain}
.module button{width:100%;min-height:44px;font-size:12px}
.module button canvas{height:23px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;text-align:center}
.stats div:first-child{grid-column:1/-1}
.stats strong{display:block;color:var(--amber);font:700 13px/1.15 ui-monospace,monospace;font-variant-numeric:tabular-nums;text-shadow:0 0 7px #ff943870;overflow-wrap:anywhere}
.stats div:first-child strong{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
#score-display{display:block;width:100%;height:auto;max-height:25px;margin:2px auto 0;background:#081c17;border-radius:3px}
.controls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px}
.controls button,.soft-drop{display:grid;place-content:center;gap:3px;min-height:64px;font-size:24px;line-height:1;background:var(--green-key,none) center/100% 100% no-repeat,linear-gradient(#36564a,#1d362c)}
.controls small,.soft-drop small{font-size:13px}
.soft-drop{width:100%;margin-top:auto;min-height:48px;font-size:19px}
.controls .drop,.overlay button{background:var(--orange-key,none) center/100% 100% no-repeat,linear-gradient(#bb531e,#893510);border-color:#7b3e21;color:#fff3dc}
.overlay{position:absolute;z-index:2;inset:0;display:grid;place-content:center;text-align:center;padding:8px;background:#06201cc7;color:var(--ink)}
.overlay[hidden]{display:none}
.overlay h2{font-size:clamp(20px,5vw,27px);margin:0 0 9px}
.overlay button{padding:0 14px;min-height:44px}
.hint{margin:8px 0 0;color:#314137;font-size:11px;line-height:1.4;text-align:center;font-weight:600}
@media(prefers-reduced-motion:reduce){button:active{transform:none}}

<main>
<header><div><h1>ORBIT <span>FALL</span></h1><div class="sub">轨道方块</div></div></header>
<div class="deck"><div class="screen" id="screen"><canvas id="board" width="300" height="600" aria-label="落块棋盘"></canvas><div class="overlay" id="overlay"><h2 id="status">准备就绪</h2><button id="play">开始游戏</button></div></div>
<aside aria-label="游戏信息">
<button id="pause" aria-label="暂停">暂停</button>
<div class="module"><span class="label">下一个</span><canvas id="next" width="96" height="72"></canvas></div>
<div class="stats"><div><span class="label">得分</span><strong id="score">0</strong><canvas id="score-display" width="120" height="28" aria-hidden="true"></canvas></div><div><span class="label">最高</span><strong id="best">0</strong></div><div><span class="label">消行</span><strong id="lines">0</strong></div><div><span class="label">等级</span><strong id="level">1</strong></div></div>
<div class="module"><button data-act="hold" aria-label="暂存或交换方块"><canvas id="held" width="96" height="72"></canvas><span>暂存</span></button></div>
<button class="soft-drop" data-act="down"><span aria-hidden="true">⏬︎</span><small>软降</small></button>
</aside></div>
<div class="controls"><button data-act="left"><span aria-hidden="true">◀</span><small>左移</small></button><button data-act="right"><span aria-hidden="true">▶</span><small>右移</small></button><button data-act="turn"><span aria-hidden="true">⟳</span><small>旋转</small></button><button class="drop" data-act="drop"><span aria-hidden="true">↓</span><small>速降</small></button></div>
<p class="hint">轻点旋转 · 横拖移动 · 下拖软降 · 快速下甩速降<br>键盘方向键 · 空格速降 · C 暂存 · P 暂停</p>
</main>
<script>
const el = id => document.getElementById(id);
const colors = ['#73dcec','#f1c96f','#c494f4','#83db9e','#ff809c','#8aabfa','#ffa775'];
const shapes = [
  ['0000','1111','0000','0000'],['11','11'],['010','111','000'],
  ['011','110','000'],['110','011','000'],['100','111','000'],['001','111','000']
].map(rows => rows.map(row => [...row].map(Number)));
const board = el('board').getContext('2d');
const kicks = {
  normal: [[[0,0],[-1,0],[-1,-1],[0,2],[-1,2]], [[0,0],[1,0],[1,1],[0,-2],[1,-2]], [[0,0],[1,0],[1,-1],[0,2],[1,2]], [[0,0],[-1,0],[-1,1],[0,-2],[-1,-2]]],
  long: [[[0,0],[-2,0],[1,0],[-2,1],[1,-2]], [[0,0],[-1,0],[2,0],[-1,-2],[2,1]], [[0,0],[2,0],[-1,0],[2,-1],[-1,2]], [[0,0],[1,0],[-2,0],[1,2],[-2,-1]]]
};
const empty = () => Array(10).fill(0);
let grid = Array.from({length:20},empty), bag = [], piece, upcoming, held;
let score = 0, lines = 0, level = 1, best = 0, usedHold = false;
let clearRows = [], flashUntil = 0;
const reducedMotion = typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches;
let state = 'ready', last = 0, gravity = 0, lockTime = 0, resets = 0, gesture;
try { best = Number(localStorage.getItem('orbit-best')) || 0; } catch {}
function take() {
  if (!bag.length) {
    bag = shapes.map((_,i)=>i);
    for(let i=bag.length-1;i>0;i--) {
      const j = Math.floor(Math.random()*(i+1));
      [bag[i],bag[j]] = [bag[j],bag[i]];
    }
  }
  return bag.pop();
}
function cells(matrix, fn) {
  matrix.forEach((row,y)=>row.forEach((v,x)=>{if(v) fn(x,y)}));
}
function fits(matrix,x,y) {
  let ok = true;
  cells(matrix,(i,j)=>{
    const col=x+i, row=y+j;
    if(col<0 || col>=10 || row>=20 || grid[row]?.[col]) ok=false;
  });
  return ok;
}
function spawn(type) {
  const matrix=shapes[type];
  piece={type,matrix,x:Math.floor((10-matrix.length)/2),y:-1,r:0};
  gravity=lockTime=resets=0;
  if(!fits(matrix,piece.x,piece.y)) show('over');
}
function advance() {
  const type=upcoming;
  upcoming=take();
  spawn(type);
}
function block(ctx,x,y,size,type,ghost=false) {
  ctx.fillStyle=colors[type];
  ctx.strokeStyle=colors[type];
  if(ghost) {
    ctx.globalAlpha=.48;
    ctx.strokeRect(x+3,y+3,size-6,size-6);
    ctx.globalAlpha=1;
    return;
  }
  ctx.fillRect(x+1,y+1,size-2,size-2);
  ctx.fillStyle='#ffffff75';
  ctx.fillRect(x+2,y+2,size-4,Math.max(2,size*.10));
  ctx.fillRect(x+2,y+4,2,size-8);
  ctx.fillStyle='#06192355';
  ctx.fillRect(x+2,y+size-5,size-4,3);
  ctx.fillRect(x+size-4,y+4,2,size-8);
  ctx.fillStyle='#ffffff24';
  ctx.fillRect(x+5,y+6,size-10,Math.max(2,size*.17));
}
function preview(id,type) {
  const ctx=el(id).getContext('2d');
  ctx.clearRect(0,0,96,72);
  if(type===undefined) return;
  const points=[];
  cells(shapes[type],(x,y)=>points.push([x,y]));
  const w=1+Math.max(...points.map(p=>p[0])), h=1+Math.max(...points.map(p=>p[1]));
  points.forEach(([x,y])=>block(ctx,(96-w*17)/2+x*17,(72-h*17)/2+y*17,17,type));
}
const digitSegments=['012456','25','02346','02356','1235','01356','013456','025','0123456','012356'];
const segmentRects=[[3,0,9,2],[1,2,2,9],[12,2,2,9],[3,11,9,2],[1,13,2,9],[12,13,2,9],[3,22,9,2]];
function paintScore() {
  const ctx=el('score-display').getContext('2d');
  const digits=String(score).padStart(6,'0');
  const scale=Math.min(1,112/(digits.length*17));
  const start=(120-digits.length*17*scale)/2;
  ctx.clearRect(0,0,120,28);
  for(const [index,digit] of [...digits].entries()) {
    for(const [segment,[x,y,w,h]] of segmentRects.entries()){
      ctx.fillStyle=digitSegments[Number(digit)].includes(String(segment))?'#ffba58':'#342e1e';
      ctx.fillRect(start+(index*17+x)*scale,(28-24*scale)/2+y*scale,w*scale,h*scale);
    }
  }
}
function paint() {
  board.fillStyle='#092923';
  board.fillRect(0,0,300,600);
  board.strokeStyle='#214a40';
  board.beginPath();
  for(let x=0;x<300;x+=30){board.moveTo(x+.5,0);board.lineTo(x+.5,600)}
  for(let y=0;y<600;y+=30){board.moveTo(0,y+.5);board.lineTo(300,y+.5)}
  board.stroke();
  if(state==='ready') {
    [[2,14,2],[3,14,2],[4,14,2],[3,13,2],[6,10,0],[6,11,0],[6,12,0],[6,13,0],[4,18,6],[4,19,6],[5,19,6],[6,19,6]].forEach(([x,y,t])=>block(board,x*30,y*30,30,t));
  }
  grid.forEach((row,y)=>row.forEach((v,x)=>{if(v) block(board,x*30,y*30,30,v-1)}));
  if(piece) {
    let landing=piece.y;
    while(fits(piece.matrix,piece.x,landing+1)) landing++;
    cells(piece.matrix,(x,y)=>block(board,(piece.x+x)*30,(landing+y)*30,30,piece.type,true));
    cells(piece.matrix,(x,y)=>block(board,(piece.x+x)*30,(piece.y+y)*30,30,piece.type));
  }
  if(clearRows.length) {
    const intensity=Math.max(0,(flashUntil-performance.now())/170);
    board.fillStyle='#bbfff0';
    board.globalAlpha=intensity*.6;
    for(const row of clearRows) {
      const width=300*intensity;
      board.fillRect((300-width)/2,row*30+11,width,8);
    }
    board.globalAlpha=1;
  }
  for(const [id,value] of Object.entries({score,best,lines,level})) el(id).textContent=value;
  paintScore();
  preview('next',state==='ready'?2:upcoming);
  preview('held',held);
}
function add(points) {
  score+=points;
  if(score>best) {
    best=score;
    try { localStorage.setItem('orbit-best',String(best)); } catch {}
  }
}
function lock() {
  let top=false;
  cells(piece.matrix,(x,y)=>{
    const row=piece.y+y;
    if(row<0) top=true;
    else grid[row][piece.x+x]=piece.type+1;
  });
  if(top){piece=undefined;show('over');return}
  if(!reducedMotion && typeof performance !== 'undefined') {
    const rows=grid.flatMap((row,index)=>row.every(Boolean)?[index]:[]);
    if(rows.length){clearRows=rows;flashUntil=performance.now()+170}
  }
  grid=grid.filter(row=>!row.every(Boolean));
  const count=20-grid.length;
  if(count) {
    grid.unshift(...Array.from({length:count},empty));
    add([0,100,300,500,800][count]*level);
    lines+=count;
    level=1+Math.floor(lines/10);
  }
  usedHold=false;
  advance();
}
function bumpLock() {
  if(resets<15 && !fits(piece.matrix,piece.x,piece.y+1)){lockTime=0;resets++}
}
function stepDown(manual) {
  if(!fits(piece.matrix,piece.x,piece.y+1)) return false;
  piece.y++;
  lockTime=0;
  if(manual){gravity=0;add(1)}
  return true;
}
function act(action) {
  if(state!=='playing') return;
  if(action==='left'||action==='right') {
    const x=piece.x+(action==='left'?-1:1);
    if(fits(piece.matrix,x,piece.y)){piece.x=x;bumpLock()}
  }
  if(action==='turn' && piece.type!==1) {
    const rotated=piece.matrix.map((row,y)=>row.map((_,x)=>piece.matrix[piece.matrix.length-1-x][y]));
    const tests=(piece.type===0?kicks.long:kicks.normal)[piece.r];
    for(const [dx,dy] of tests) {
      if(!fits(rotated,piece.x+dx,piece.y+dy)) continue;
      piece.matrix=rotated;
      piece.x+=dx;
      piece.y+=dy;
      piece.r=(piece.r+1)%4;
      bumpLock();
      break;
    }
  }
  if(action==='down') stepDown(true);
  if(action==='drop') {
    let distance=0;
    while(stepDown(false)) distance++;
    add(distance*2);
    lock();
  }
  if(action==='hold' && !usedHold) {
    const old=held;
    held=piece.type;
    usedHold=true;
    if(old===undefined) advance();
    else spawn(old);
  }
  paint();
}
function show(mode) {
  state=mode;
  el('overlay').hidden=mode==='playing';
  el('pause').disabled=mode==='ready'||mode==='over';
  el('pause').textContent=mode==='paused'?'继续':'暂停';
  el('pause').setAttribute('aria-label',el('pause').textContent);
  if(mode==='paused'||mode==='over') {
    el('status').textContent=mode==='paused'?'已暂停':'游戏结束';
    el('play').textContent=mode==='paused'?'继续游戏':'再来一局';
  }
}
function start() {
  if(state==='paused'){show('playing');return}
  grid=Array.from({length:20},empty);
  clearRows=[];
  score=lines=0;
  level=1;
  bag=[];
  held=undefined;
  usedHold=false;
  upcoming=take();
  show('playing');
  advance();
  paint();
}
function pause() {
  if(state==='playing') show('paused');
  else if(state==='paused') show('playing');
}
el('play').onclick=start;
el('pause').onclick=pause;
document.addEventListener('visibilitychange',()=>{if(document.hidden && state==='playing') show('paused')});
document.addEventListener('keydown',e=>{
  if(e.code==='KeyP'||e.code==='Escape'){if(!e.repeat) pause();return}
  if(e.code==='Space' && e.target instanceof HTMLButtonElement && state!=='playing') return;
  const action={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'turn',ArrowDown:'down',Space:'drop',KeyC:'hold'}[e.code];
  if(action && state==='playing'){
    e.preventDefault();
    if(!e.repeat || ['left','right','down'].includes(action)) act(action);
  }
});
for(const button of document.querySelectorAll('[data-act]')){
  const action=button.dataset.act;
  let timer, interval;
  const clear=()=>{clearTimeout(timer);clearInterval(interval)};
  button.onpointerdown=e=>{
    if(!e.isPrimary||e.button!==0) return;
    button.setPointerCapture(e.pointerId);
    act(action);
    if(['left','right','down'].includes(action)) timer=setTimeout(()=>{interval=setInterval(()=>act(action),42)},130);
  };
  for(const name of ['pointerup','pointercancel','lostpointercapture']) button.addEventListener(name,clear);
  button.onclick=e=>{if(e.detail===0) act(action)};
}
const screen=el('screen');
screen.onpointerdown=e=>{
  if(state!=='playing'||!e.isPrimary||e.button!==0) return;
  screen.setPointerCapture(e.pointerId);
  gesture={id:e.pointerId,x:e.clientX,y:e.clientY,startX:e.clientX,startY:e.clientY,t:performance.now(),axis:null,piece};
};
screen.onpointermove=e=>{
  if(gesture?.id!==e.pointerId||gesture.piece!==piece||state!=='playing') return;
  const g=gesture, dx=e.clientX-g.x, dy=e.clientY-g.y;
  if(!g.axis && Math.max(Math.abs(dx),Math.abs(dy))>=10) g.axis=Math.abs(dx)>Math.abs(dy)?'x':'y';
  const step=Math.max(11,screen.clientWidth/12);
  if(g.axis==='x') {
    const count=Math.trunc(dx/step);
    for(let i=0;i<Math.abs(count);i++) act(count<0?'left':'right');
    g.x+=count*step;
  }
  if(g.axis==='y' && dy>=step) {
    const count=Math.floor(dy/step);
    for(let i=0;i<count;i++) act('down');
    g.y+=count*step;
  }
};
screen.onpointerup=e=>{
  if(gesture?.id!==e.pointerId) return;
  const g=gesture;
  gesture=undefined;
  if(g.piece!==piece||state!=='playing') return;
  const dx=e.clientX-g.startX, dy=e.clientY-g.startY, ms=performance.now()-g.t;
  if(g.axis!=='x'&&dy>48&&dy>Math.abs(dx)*1.4&&dy/Math.max(ms,1)>.45&&ms<320) act('drop');
  else if(!g.axis && Math.hypot(dx,dy)<10 && ms<350) act('turn');
};
screen.onpointercancel=()=>{gesture=undefined};
function tick(now) {
  const dt=Math.min(now-last,50);
  last=now;
  if(state==='playing') {
    gravity+=dt;
    if(gravity>=Math.max(65,850*Math.pow(.81,level-1))) {
      gravity=0;
      if(stepDown(false)) paint();
    }
    if(!fits(piece.matrix,piece.x,piece.y+1)) {
      lockTime+=dt;
      if(lockTime>=425){lock();paint()}
    }
  }
  if(clearRows.length) {
    if(now>=flashUntil) clearRows=[];
    paint();
  }
  requestAnimationFrame(tick);
}
show('ready');
paint();
requestAnimationFrame(tick);
</script>
</html>
