  padding:4px 12px;gap:2.8cqw;background:linear-gradient(#a04f58,#813b48);
  border:2px solid #f6d2a4;border-radius:20px;box-shadow:0 2px #914654
}
header h1{color:#fff3d9;font-size:5.05cqw;text-shadow:none}
.mascot{
  width:1.28em;aspect-ratio:1.21;border-radius:24% 24% 46% 46%;transform:none;
  background:radial-gradient(circle at 28% 48%,#694144 0 5%,transparent 6%),
    radial-gradient(circle at 72% 48%,#694144 0 5%,transparent 6%),
    radial-gradient(circle at 23% 66%,#ec9c9e 0 7%,transparent 8%),
    radial-gradient(circle at 77% 66%,#ec9c9e 0 7%,transparent 8%),linear-gradient(#fff9e9,#efcfb2);
  box-shadow:inset 0 2px #fff9ed,0 1px #603039
}
.mascot:before{content:"";position:absolute;left:87%;top:17%;width:32%;height:39%;border:2px solid #f8dec2;border-radius:50%}
.mascot:after{inset:52% 42% 27%;border:0;border-bottom:1px solid #7b4a45;transform:none;border-radius:50%}
.deck{
  background:linear-gradient(150deg,#f2cdbf,#e9b4b0 65%,#edc0ad);
  border-color:#ca8e78;box-shadow:inset 0 0 0 2px #ffeece,0 2px 4px #95575246
}
.screen{background:#4a3035;box-shadow:0 0 0 2px #a97069,0 0 0 5px #ffe6c8}
.screen:before{background:radial-gradient(ellipse at 24% -6%,#f8c6a436,transparent 45%)}
.screen:after{box-shadow:inset 0 0 0 1px #ffe5c16e,inset 0 0 15px #a976753a}
aside .module,.stats,.module button{
  background:linear-gradient(150deg,#fff7e6,#fae4ca);border-color:#ce987e;
  box-shadow:inset 0 1px #fff9ec,0 2px #bc83727d;color:#77474a
}
.module button{box-shadow:none}
aside .module .label,aside .stats .label,.module button span,.stats strong{color:#75454c}
.module canvas,#score-display,.stats div:nth-child(n+3) strong{
  background:#f3d9ca;border-color:#dfb4a4;box-shadow:inset 0 2px 4px #9a615626
}
.stats div:nth-child(n+3){background:#fff0da;border-color:#e7c2ac}
#pause,.controls button,.soft-drop,.overlay button,#sound{
  --key-hi:#fff0d4;--key-mid:#efc39d;--key-edge:#bf896a;--key-text:#633f3b;
  border-color:var(--key-edge);
  box-shadow:inset 0 0 0 3px #fff4df90,inset 0 -5px #aa68501a,0 4px 0 var(--key-edge),0 6px 8px #8a504b38
}
.controls button{border-radius:23%}
.controls [data-act="left"]{--key-hi:#fff1d5;--key-mid:#eec29b;--key-edge:#bc896e;--key-text:#684239}
.controls [data-act="right"]{--key-hi:#fff2df;--key-mid:#efc9a9;--key-edge:#bf8b71;--key-text:#684239}
.controls [data-act="turn"]{--key-hi:#e7f0ca;--key-mid:#c5d5a2;--key-edge:#8f9d6c;--key-text:#46543b}
.controls .drop,.overlay button{--key-hi:#ffdedf;--key-mid:#e9a3ab;--key-edge:#ab6471;--key-text:#6b3548}
.soft-drop{--key-hi:#fff0cc;--key-mid:#f0cc98;--key-edge:#be936a;--key-text:#684239}
#pause,#sound{box-shadow:inset 0 1px #fff9ed,0 2px #bc8372}
.overlay{background:#513142bb;color:#fff2d8}
.controls button:active,.soft-drop:active,.overlay button:active{box-shadow:inset 0 2px 4px #7b48472b}

<main>
<header><div><h1>The Jolly Bean Café</h1><span class="mascot" aria-hidden="true"></span></div></header>
<div class="deck"><div class="screen" id="screen"><canvas id="board" width="300" height="600" aria-label="落块棋盘"></canvas><div id="clear-feedback" role="status"></div><div class="overlay" id="overlay"><h2 id="status">准备就绪</h2><button id="play">开始游戏</button></div></div>
<aside aria-label="游戏信息">
<button id="pause" aria-label="暂停">暂停</button>
<div class="module"><span class="label">下一个</span><canvas id="next" width="96" height="72"></canvas></div>
<div class="stats"><div><span class="label">得分</span><strong id="score">0</strong><canvas id="score-display" width="120" height="28" aria-hidden="true"></canvas></div><div><span class="label">最高</span><strong id="best">0</strong></div><div><span class="label">消行</span><strong id="lines">0</strong></div><div><span class="label">等级</span><strong id="level">1</strong></div></div>
<div class="module"><button data-act="hold" aria-label="暂存或交换方块"><canvas id="held" width="96" height="72"></canvas><span>暂存</span></button></div>

</aside></div>
<div class="soft-row"><button class="soft-drop" data-act="down"><span aria-hidden="true"><i class="chevrons"></i></span><small>软降</small></button></div>
<div class="controls" aria-label="游戏操作"><button data-act="left"><span aria-hidden="true">◀</span><small>左移</small></button><button data-act="right"><span aria-hidden="true">▶</span><small>右移</small></button><button data-act="turn"><span aria-hidden="true">⟳</span><small>旋转</small></button><button class="drop" data-act="drop"><span aria-hidden="true">↓</span><small>速降</small></button></div>

<div class="settings" aria-label="游戏设置">
<button id="edit-layout" type="button">自定义布局</button>
<button id="sound" type="button" aria-pressed="true">音效：开</button>
<button id="music" type="button" aria-pressed="false">圣诞音乐：关</button>
</div>
</main>

 <form method="dialog">

  <label id="editor-soft">软降高度 <input id="soft-position" type="range" min="0" max="100" step="1" aria-label="软降位置，从上到下"></label>
  <div id="editor-keys" aria-label="四个主键的排列"></div>
  <div class="layout-actions">
   <button id="reset-layout" type="button">恢复默认</button>
   <button value="cancel">取消</button><button value="save">保存</button>
  </div>
 </form>
</dialog>

function scheduleMusic() {
  if(!musicEnabled||audio?.state!=='running'||document.hidden) return;
  if(nextBeat<audio.currentTime) nextBeat=audio.currentTime+.035;
  while(nextBeat<audio.currentTime+.16) {
    const [pitch,beats]=carol[nextNote];
    if(pitch) {
      const note=audio.createOscillator(), envelope=audio.createGain();
      const duration=Math.min(.64,beats*.28);
      note.type='triangle';
      note.frequency.value=440*2**((pitch-69)/12);
      envelope.gain.setValueAtTime(.001,nextBeat);
      envelope.gain.exponentialRampToValueAtTime(.09,nextBeat+.02);
      envelope.gain.exponentialRampToValueAtTime(.001,nextBeat+duration);
      note.connect(envelope).connect(musicGain);
      note.start(nextBeat);
      note.stop(nextBeat+duration);
    }
    nextNote=(nextNote+1)%carol.length;
    nextBeat+=beats*.29;
  }
}
function updateMusic() {

}

function sound(name) {

    note.type=name==='lock'?'triangle':'sine';
    note.frequency.value=hz;

function take() {

function cells(matrix, fn) {

function block(ctx,x,y,size,type,ghost=false) {

  ctx.roundRect(x+1,y+1,size-2,size-2,radius);
  ctx.fill();
  ctx.strokeStyle='#ffffff70';
  ctx.stroke();
  ctx.fillStyle='#55336836';
  ctx.beginPath();

function paintScore() {

function paint() {

  const chainBonus=50*Math.max(0,combo);

  if(chained) labels.push('BACK-TO-BACK');

  if(allClear) labels.push('全清 PERFECT CLEAR');

  if(g.axis==='y' && dy>=step) {
    const count=Math.floor(dy/step);
    for(let i=0;i<count;i++) act('down');
    g.y+=count*step;
  }
};
screen.onpointerup=e=>{
  if(gesture?.id!==e.pointerId) return;
  const g=gesture;
  gesture=undefined;
  if(g.piece!==piece||state!=='playing') return;
  const dx=e.clientX-g.startX, dy=e.clientY-g.startY, ms=performance.now()-g.t;
  if(g.axis!=='x'&&dy>48&&dy>Math.abs(dx)*1.4&&dy/Math.max(ms,1)>.45&&ms<320) act('drop');
  else if(!g.axis && Math.hypot(dx,dy)<10 && ms<350) act('turn');
};
screen.onpointercancel=()=>{gesture=undefined};
function tick(now) {
  const dt=Math.min(now-last,50);
  last=now;
  if(state==='playing') {
    gravity+=dt;
    if(gravity>=Math.max(65,850*Math.pow(.81,level-1))) {
      gravity=0;
      if(stepDown(false)) paint();
    }
    if(!fits(piece.matrix,piece.x,piece.y+1)) {
      lockTime+=dt;
      if(lockTime>=425){lock();paint()}
    }
  }
  if(clearRows.length) {
    if(now>=flashUntil) clearRows=[];
    paint();
  }
  requestAnimationFrame(tick);
}
show('ready');
paint();
requestAnimationFrame(tick);
</script>
</html>
